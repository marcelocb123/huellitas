<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1268e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Huellitas">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="description" content="Huellitas: encuentra, ayuda y adopta mascotas en un solo lugar.">
  <title>Huellitas — Encuentra, ayuda y adopta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" data-route="home" aria-label="Ir a inicio">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none"><path d="M25 42c0 8-5 13-11 13s-10-4-10-10c0-5 4-9 9-11 4-2 12 2 12 8Z" fill="currentColor"/><ellipse cx="15" cy="18" rx="6.5" ry="9" fill="currentColor"/><ellipse cx="30" cy="12.5" rx="6" ry="9" transform="rotate(18 30 12.5)" fill="currentColor"/><ellipse cx="45" cy="17" rx="6.5" ry="9" transform="rotate(28 45 17)" fill="currentColor"/><ellipse cx="55" cy="29" rx="6" ry="9" transform="rotate(51 55 29)" fill="currentColor"/></svg>
        </div>
        <div>
          <strong>Huellitas</strong>
          <span>encuentra · ayuda · adopta</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="installBtn" hidden aria-label="Instalar Huellitas" title="Instalar aplicación">⇩</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Configuración" title="Configuración">⚙</button>
      </div>
    </header>

    <main id="main" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-route="home" aria-label="Inicio"><span class="nav-icon">⌂</span><span>Inicio</span></button>
      <button class="nav-item" data-route="lost" aria-label="Perdidos y encontrados"><span class="nav-icon">⌕</span><span>Buscar</span></button>
      <button class="report-fab" id="reportBtn" aria-label="Reportar una mascota"><span>＋</span><small>Reportar</small></button>
      <button class="nav-item" data-route="adopt" aria-label="Adopciones"><span class="nav-icon">♥</span><span>Adopta</span></button>
      <button class="nav-item" data-route="services" aria-label="Servicios veterinarios"><span class="nav-icon">✚</span><span>Servicios</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="installHelp" class="install-help" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
